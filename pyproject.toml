[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autobass"
version = "0.1.0"
description = "YouTube audio to bass TAB transcription CLI tool"
requires-python = ">=3.11"
dependencies = [
    "loguru>=0.7",
    "pretty-midi>=0.2.10",
]

[project.optional-dependencies]
# Full audio pipeline: download -> separate -> transcribe.
# basic-pitch pulls in TensorFlow, which needs Python 3.11.
pipeline = [
    "yt-dlp>=2024.0",
    "demucs>=4.0",
    "basic-pitch>=0.3",
    "librosa>=0.10",
    "scipy>=1.10",
    "soundfile>=0.12",
    "numpy>=1.24",
]
# Local web interface (web_app.py); combine with the pipeline extra.
web = [
    "flask>=3.0",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
autobass = "main:main"

[tool.setuptools]
py-modules = ["main", "web_app"]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
